<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Reminder App</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap"><section class="card"><h1>⏰ My Reminder App</h1><p>Save a reminder and send an SMS after it becomes due.</p><form id="form"><label>Phone number<input id="phone" type="tel" placeholder="+9779812345678" required></label><label>Reminder<textarea id="message" maxlength="1000" placeholder="Example: Call Mom" required></textarea></label><div class="row"><label>Date<input id="date" type="date" required></label><label>Time<input id="time" type="time" required></label></div><button id="save">Save Reminder</button></form><div id="status"></div></section><section class="card"><h2>Saved reminders</h2><div id="list">Loading...</div></section><section class="card"><h2>How it works</h2><p>The reminder is stored first. When the checker runs, any reminder whose time has passed is sent. Missing the exact time does not delete it.</p></section></main><script src="/script.js"></script></body></html>
